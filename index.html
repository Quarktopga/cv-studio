.shell{min-height:100vh;display:flex;flex-direction:column}.topbar{height:70px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 94%,transparent);display:flex;align-items:center;padding:0 max(22px,5vw);gap:34px;position:sticky;top:0;z-index:30;backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:10px;font:800 18px Manrope;letter-spacing:-.04em}.mark{width:30px;height:30px;border:2px solid currentColor;border-radius:8px;position:relative;transform:rotate(-6deg);display:grid;place-items:center}.mark:after{content:'';width:11px;height:11px;background:var(--accent);border-radius:3px}.nav{display:flex;gap:26px;color:var(--muted);font-size:14px}.nav a:hover{color:var(--text)}.spacer{flex:1}.actions{display:flex;align-items:center;gap:9px}.theme{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.theme button{width:27px;height:27px;background:transparent;color:var(--muted);border-radius:6px}.theme button.active{background:var(--panel2);color:var(--text)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:var(--panel);color:var(--text);font-weight:600;font-size:13px;transition:.15s}.btn:hover{transform:translateY(-1px)}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.primary:hover{background:var(--accent2)}.small{padding:8px 11px;font-size:12px}.ghost{background:transparent;border-color:transparent;color:var(--muted)}.danger{color:var(--danger)}.avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-weight:700;color:var(--text)}
main{flex:1}.container{width:min(1160px,92%);margin:auto}.hero{padding:105px 0 70px;text-align:center}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--accent);font-weight:700}.hero h1{font:800 clamp(48px,7vw,82px)/.98 Manrope;letter-spacing:-.06em;margin:17px 0}.hero h1 span{color:var(--accent)}.hero p{max-width:650px;margin:24px auto;color:var(--muted);font-size:18px;line-height:1.65}.heroBtns{display:flex;justify-content:center;gap:10px}.showcase{width:min(720px,100%);margin:0 auto 80px;padding:34px;background:linear-gradient(145deg,var(--panel2),var(--bg));border:1px solid var(--line);border-radius:18px}.paper{background:#fff;color:#15171a;border:1px solid #e5e7eb;box-shadow:var(--shadow);width:min(560px,100%);margin:auto;padding:48px;min-height:620px}.paper h2{font:800 28px Manrope;margin:0}.paper .sub{font-size:13px;margin-top:4px}.paper .meta{font-size:10px;color:#777;margin-top:11px}.rule{height:1px;background:#ddd;margin:24px 0}.fakeSec{margin-top:25px}.fakeSec h4{font:700 10px Manrope;letter-spacing:.12em;margin:0 0 12px}.fakeRow{display:grid;grid-template-columns:65px 1fr;gap:12px;margin:11px 0}.fakeRow>span{font-size:9px;color:#777}.fakeRow b{font-size:11px}.fakeRow p{font-size:9px;color:#666;line-height:1.45;margin:3px 0}.features{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin-bottom:90px}.feature{padding:30px;background:var(--panel);border-right:1px solid var(--line)}.feature:last-child{border-right:0}.feature b{font:600 11px Manrope;color:var(--accent)}.feature h3{font:700 18px Manrope;margin:16px 0 7px}.feature p{font-size:13px;line-height:1.6;color:var(--muted);margin:0}
.auth{display:grid;place-items:center;padding:70px 20px}.authBox{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:36px;box-shadow:var(--shadow)}.authBox .brand{justify-content:center;margin-bottom:28px}.authBox h1{font:700 28px Manrope;margin:0 0 8px;text-align:center}.authBox>p{text-align:center;color:var(--muted);font-size:14px;margin:0 0 22px}.oauth{width:100%;height:44px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;margin-top:9px;font-weight:600}.oauth:hover{background:var(--panel2)}.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;margin:22px 0}.divider:before,.divider:after{content:'';height:1px;background:var(--line);flex:1}.email{display:flex;gap:8px}.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);outline:none}.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}.authFine{text-align:center;color:var(--muted);font-size:11px;line-height:1.5;margin-top:17px}.notice{padding:12px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;font-size:13px;line-height:1.5}
.page{padding:58px 0 90px}.pageHead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:36px}.pageHead h1{font:800 44px Manrope;letter-spacing:-.05em;margin:8px 0}.pageHead p{color:var(--muted);margin:0;font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--panel);position:relative}.thumb{height:300px;background:var(--panel2);display:grid;place-items:center;padding:25px}.mini{width:185px;height:250px;background:#fff;color:#151515;padding:19px;box-shadow:0 10px 25px #0002}.mini strong{font:800 10px Manrope;display:block}.mini small{font-size:6px;color:#666}.miniSec{margin-top:18px}.miniSec b{font:700 6px Manrope;letter-spacing:.08em}.miniSec i{display:block;height:1px;background:#ddd;margin-top:4px}.cardBody{padding:18px}.cardBody h3{font:700 17px Manrope;margin:0 0 4px}.muted{color:var(--muted);font-size:12px}.cardActions{display:flex;gap:5px;margin-top:15px}.cardMenu{position:absolute;right:11px;top:11px;z-index:2;background:#fff;color:#333;border:1px solid #ddd;border-radius:7px;padding:7px}.empty{padding:80px 20px;border:1px dashed var(--line);border-radius:13px;text-align:center}.empty h2{font:700 22px Manrope}.empty p{color:var(--muted);font-size:13px;margin-bottom:20px}
.editor{min-height:calc(100vh - 70px)}.editorBar{height:62px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:10px;padding:0 18px;position:sticky;top:70px;z-index:20}.back{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:8px;color:var(--text)}.titleEdit{width:230px;border:0;background:transparent;color:var(--text);font-weight:700;outline:0}.save{font-size:11px;color:var(--muted)}.editorBody{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 132px)}.side{border-right:1px solid var(--line);background:var(--panel);padding:20px 15px}.side h3{font:700 12px Manrope;margin:0 0 15px}.outline{width:100%;padding:10px;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:8px;font-size:12px}.secNav{display:flex;align-items:center;width:100%;padding:10px 8px;margin-top:5px;border-radius:7px;background:transparent;color:var(--muted);text-align:left}.secNav.active{background:var(--panel2);color:var(--text)}.secNav span{flex:1}.secNav button{background:transparent;color:var(--muted);font-size:11px}.canvas{background:#e9ebee;padding:42px 24px;overflow:auto}.cv{width:min(820px,100%);min-height:1120px;background:#fff;color:#151515;margin:auto;padding:66px 72px;box-shadow:0 18px 60px #0002}.cvHead input{display:block;width:100%;background:transparent;border:1px solid transparent;outline:0;color:#151515}.cvName{font:800 30px Manrope}.cvHeadline{font-size:15px;margin-top:5px}.cvContact{font-size:11px;color:#777;margin-top:10px}.section{margin-top:30px}.sectionTitle{display:flex;align-items:center;border-bottom:1px solid #d9d9d9;padding-bottom:7px}.sectionTitle input{flex:1;border:0;background:transparent;outline:0;color:#151515;font:700 11px Manrope;text-transform:uppercase;letter-spacing:.12em}.tools{display:flex}.tools button{background:transparent;color:#888;padding:4px}.tableHead,.row{display:grid;grid-template-columns:95px minmax(0,1fr) 105px;gap:14px}.tableHead{font-size:8px;color:#999;text-transform:uppercase;padding:8px 0}.row{position:relative;border-top:1px solid #eee;padding:13px 0}.row input,.row textarea{background:transparent;border:1px solid transparent;outline:0;color:#151515;width:100%}.row textarea{resize:vertical;min-height:44px;font-size:11px;line-height:1.5}.rowTitle{font-weight:700}.linkRow{display:flex;gap:5px;margin-top:5px}.linkRow input{font-size:9px;border-bottom:1px solid #ddd}.imageCell img,.imageAdd{width:82px;height:68px;object-fit:cover;border-radius:5px}.imageAdd{border:1px dashed #ccc;background:#fafafa;color:#888;display:grid;place-items:center;font-size:10px}.rowTools{position:absolute;right:-48px;top:10px;display:flex;flex-direction:column;opacity:0}.row:hover .rowTools{opacity:1}.rowTools button{background:transparent;color:#888;padding:4px}.addRow,.addSection{background:transparent;color:#2457e6;font-size:10px;padding:10px 0}.addSection{display:block;margin:30px auto}.cropHint{font-size:9px;color:#777;margin-top:4px}
.settings{width:min(760px,92%);margin:auto;padding:60px 0}.settings h1,.legal h1{font:800 44px Manrope;letter-spacing:-.05em;margin:8px 0}.settingsCard,.legalCard{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:28px;margin-top:28px}.label{font-size:12px;font-weight:700;display:block;margin-bottom:18px}.label input{display:block;margin-top:7px}.settingRow{display:flex;justify-content:space-between;align-items:center;padding:17px 0;border-top:1px solid var(--line);gap:20px}.settingRow p{margin:0}.settingRow strong{font-size:13px}.settingRow span{font-size:11px;color:var(--muted)}.switch{width:42px;height:24px;border-radius:99px;background:#bbb;position:relative}.switch.on{background:var(--accent)}.switch:after{content:'';width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.15s}.switch.on:after{left:21px}.legal{width:min(820px,92%);margin:auto;padding:60px 0}.legal .lead{color:var(--muted);font-size:14px}.legalCard h2{font:700 19px Manrope;margin-top:30px}.legalCard p,.legalCard li{color:var(--muted);font-size:13px;line-height:1.75}.footer{border-top:1px solid var(--line);padding:25px 5vw;display:flex;gap:20px;align-items:center;color:var(--muted);font-size:11px;margin-top:auto}.footer .brand{color:var(--text);font-size:14px;margin-right:auto}.loading{padding:100px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:22px;right:22px;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:9px;font-size:12px;box-shadow:var(--shadow);z-index:100}.hidden{display:none!important}
@media(max-width:850px){.nav{display:none}.topbar{padding:0 16px}.features,.grid{grid-template-columns:1fr}.hero{padding:75px 0 50px}.hero h1{font-size:50px}.hero p{font-size:16px}.heroBtns{flex-direction:column}.pageHead{align-items:start;flex-direction:column}.editorBody{grid-template-columns:1fr}.side{display:none}.cv{padding:40px 30px}.rowTools{display:none}.canvas{padding:20px 10px}.editorBar{top:70px}.footer{flex-direction:column;align-items:start}.footer .brand{margin-right:0}}
@media print{.topbar,.editorBar,.side,.footer,.publicTools{display:none!important}.canvas{padding:0;background:#fff}.cv{box-shadow:none;width:100%;margin:0}.editorBody{display:block}.editor{min-height:0}}

<body>
<div id="app"></div><div id="toast" class="toast hidden"></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL='https://qoidjubuqycjnzmjswvv.supabase.co';
const SUPABASE_KEY='sb_publishable_CYjYGjZ2jFYmaE4wWwEgzg_CoyawiQQ';
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>crypto.randomUUID(); const theme=()=>localStorage.getItem('cv-theme')||'system';
function setTheme(t){localStorage.setItem('cv-theme',t);document.documentElement.dataset.theme=t;render()}
function effectiveClass(){return theme()==='dark'||(theme()==='system'&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':''}
function logo(){return `<a class="brand" href="#/"><i class="mark"></i><span>CV Studio</span></a>`}
function themeUI(){return `<div class="theme"><button class="${theme()==='light'?'active':''}" onclick="setTheme('light')" title="Clair">☼</button><button class="${theme()==='system'?'active':''}" onclick="setTheme('system')" title="Système">◐</button><button class="${theme()==='dark'?'active':''}" onclick="setTheme('dark')" title="Sombre">◑</button></div>`}
function shell(content,user){return `<div class="shell ${effectiveClass()}"><header class="topbar">${logo()}<nav class="nav"><a href="#/">Accueil</a>${user?'<a href="#/dashboard">Mes CV</a>':''}<a href="#/terms">Conditions</a></nav><div class="spacer"></div><div class="actions">${themeUI()}${user?`<button class="avatar" onclick="location.hash='#/account'">${esc((user.user_metadata?.full_name||user.email||'U').slice(0,1).toUpperCase())}</button>`:`<a class="btn primary small" href="#/login">Commencer</a>`}</div></header>${content}<footer class="footer">${logo()}<span>©2026 Georges-Antoine de Boissieu. Tous droits réservés.</span></footer></div>`}
function landing(){return `<main><div class="container"><section class="hero"><div class="eyebrow">L'éditeur de CV nouvelle génération</div><h1>Votre parcours.<br><span>Votre CV.</span></h1><p>Créez plusieurs CV professionnels, structurez chaque expérience et partagez votre profil avec une présentation claire et élégante.</p><div class="heroBtns"><a class="btn primary" href="#/login">Créer mon CV →</a><a class="btn" href="#/dashboard">Voir l'espace de travail</a></div></section><section class="showcase"><div class="paper"><h2>PRÉNOM NOM</h2><div class="sub">Développeur · Intelligence artificielle · Web</div><div class="meta">Paris, France · email@example.com · github.com</div><div class="rule"></div><div class="fakeSec"><h4>EXPÉRIENCE</h4><div class="fakeRow"><span>2026</span><div><b>Projet logiciel</b><p>Conception et développement d'une application moderne.</p></div></div><div class="fakeRow"><span>2025</span><div><b>Stage en technologie</b><p>Mise en œuvre de solutions numériques et travail en équipe.</p></div></div></div><div class="fakeSec"><h4>FORMATION</h4><div class="fakeRow"><span>2025</span><div><b>Établissement</b><p>Formation · spécialisation · résultats.</p></div></div></div></div></section><section class="features"><div class="feature"><b>01</b><h3>Structuré</h3><p>Un éditeur conçu autour du contenu et de la lisibilité, pas du placement de pixels.</p></div><div class="feature"><b>02</b><h3>Professionnel</h3><p>Une mise en page cohérente, sobre et prête à être exportée.</p></div><div class="feature"><b>03</b><h3>Partageable</h3><p>Plusieurs CV et, bientôt, une page publique professionnelle unique.</p></div></section></div></main>`}
function login(){return `<main class="auth"><div class="authBox">${logo()}<h1>Créer votre espace</h1><p>Votre CV est enregistré automatiquement et reste sous votre contrôle.</p><button class="oauth" onclick="oauth('google')">Continuer avec Google</button><button class="oauth" onclick="oauth('azure')">Continuer avec Microsoft</button><div class="divider">ou par e-mail</div><div id="emailBox"><div class="email"><input id="email" class="field" type="email" placeholder="vous@exemple.fr"><button class="btn primary" onclick="emailLogin()">Continuer</button></div></div><div class="authFine">En continuant, vous acceptez les <a href="#/terms">Conditions générales</a>.</div></div></main>`}
async function oauth(provider){await db.auth.signInWithOAuth({provider,options:{redirectTo:location.origin+location.pathname}})}
async function emailLogin(){const e=$('#email').value.trim();if(!e)return;const {error}=await db.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href}});if(error)toast(error.message);else $('#emailBox').innerHTML=`<div class="notice">Un lien de connexion a été envoyé à <strong>${esc(e)}</strong>.</div>`}
const starter=()=>({header:{name:'Prénom NOM',headline:'Titre professionnel',contact:'Paris, France · email@example.com'},sections:[{id:id(),title:'Expérience',rows:[{id:id(),date:'2026',title:'Projet ou poste',text:'Décrivez votre expérience, vos responsabilités et vos résultats.',linkLabel:'',linkUrl:'',imageUrl:''}]},{id:id(),title:'Formation',rows:[{id:id(),date:'2025',title:'Établissement',text:'Formation, spécialisation ou diplôme.',linkLabel:'',linkUrl:'',imageUrl:''}]}]});
async function dashboard(user){const {data,error}=await db.from('resumes').select('*').eq('user_id',user.id).order('updated_at',{ascending:false});if(error)return shell(`<main class="page container"><div class="notice">${esc(error.message)}</div></main>`,user);const cards=(data||[]).map(cv=>`<article class="card"><div class="thumb"><div class="mini"><strong>${esc(cv.content?.header?.name||'PRÉNOM NOM')}</strong><small>${esc(cv.content?.header?.headline||'Titre professionnel')}</small>${(cv.content?.sections||[]).slice(0,2).map(s=>`<div class="miniSec"><b>${esc(s.title)}</b><i></i></div>`).join('')}</div></div><button class="cardMenu" onclick="deleteCV('${cv.id}')" title="Supprimer">×</button><div class="cardBody"><h3>${esc(cv.title)}</h3><div class="muted">Modifié le ${new Date(cv.updated_at).toLocaleDateString('fr-FR')}</div><div class="cardActions"><a class="btn primary small" href="#/editor/${cv.id}">Modifier</a><button class="btn small" onclick="duplicateCV('${cv.id}')">Dupliquer</button></div></div></article>`).join('');return shell(`<main class="page container"><div class="pageHead"><div><div class="eyebrow">Espace personnel</div><h1>Mes CV</h1><p>Gérez toutes vos versions professionnelles au même endroit.</p></div><button class="btn primary" onclick="newCV()">+ Nouveau CV</button></div>${cards?`<div class="grid">${cards}</div>`:`<div class="empty"><h2>Votre premier CV</h2><p>Commencez avec une structure professionnelle et adaptez-la à votre parcours.</p><button class="btn primary" onclick="newCV()">Créer mon CV</button></div>`}</main>`,user)}
async function newCV(){const {data,error}=await db.from('resumes').insert({user_id:current.id,title:'Mon CV',content:starter(),is_public:false}).select().single();if(error)toast(error.message);else location.hash='#/editor/'+data.id}
async function deleteCV(i){if(!confirm('Supprimer définitivement ce CV ?'))return;const {error}=await db.from('resumes').delete().eq('id',i);if(error)toast(error.message);else render()}
async function duplicateCV(i){const {data}=await db.from('resumes').select('*').eq('id',i).single();if(!data)return;const {error}=await db.from('resumes').insert({user_id:current.id,title:data.title+' — copie',content:data.content,is_public:false});if(error)toast(error.message);else render()}
let current=null,saveTimer=null;
async function editor(user,i){const {data,error}=await db.from('resumes').select('*').eq('id',i).eq('user_id',user.id).single();if(error||!data)return shell(`<main class="loading">CV introuvable.</main>`,user);const cv=data,c=cv.content;const sections=c.sections||[];const rows=(s,si)=>s.rows.map((r,ri)=>`<div class="row"><input value="${esc(r.date)}" placeholder="Date" onchange="edit(${si},${ri},'date',this.value)"><div><input class="rowTitle" value="${esc(r.title)}" placeholder="Titre" onchange="edit(${si},${ri},'title',this.value)"><textarea placeholder="Description" onchange="edit(${si},${ri},'text',this.value)">${esc(r.text)}</textarea><div class="linkRow"><input placeholder="Ancre du lien" value="${esc(r.linkLabel)}" onchange="edit(${si},${ri},'linkLabel',this.value)"><input placeholder="URL" value="${esc(r.linkUrl)}" onchange="edit(${si},${ri},'linkUrl',this.value)"></div></div><div class="imageCell">${r.imageUrl?`<img src="${esc(r.imageUrl)}" class="imageCell img">`:`<label class="imageAdd">+ Image<input type="file" accept="image/*" hidden onchange="uploadImage(${si},${ri},this.files[0])"></label>`}</div><div class="rowTools"><button onclick="addRow(${si},${ri})">+</button><button onclick="removeRow(${si},${ri})">×</button></div></div>`).join('');return `<div class="shell ${effectiveClass()}"><div class="editor"><div class="editorBar"><button class="back" onclick="location.hash='#/dashboard'">←</button><input class="titleEdit" value="${esc(cv.title)}" onchange="renameCV(this.value)"><span class="save" id="saveState">Enregistré</span><div class="spacer"></div><a class="btn small" href="#/public/${cv.id}">Aperçu</a><button class="btn primary small" onclick="window.print()">Exporter PDF</button></div><div class="editorBody"><aside class="side"><h3>CONTENU</h3><button class="outline" onclick="addSection()">+ Ajouter une section</button>${sections.map((s,si)=>`<button class="secNav"><span>${esc(s.title)}</span><button onclick="moveSection(${si},-1)">↑</button><button onclick="moveSection(${si},1)">↓</button></button>`).join('')}</aside><section class="canvas"><div class="cv"><header class="cvHead"><input class="cvName" value="${esc(c.header.name)}" onchange="editHeader('name',this.value)"><input class="cvHeadline" value="${esc(c.header.headline)}" onchange="editHeader('headline',this.value)"><input class="cvContact" value="${esc(c.header.contact)}" onchange="editHeader('contact',this.value)"></header>${sections.map((s,si)=>`<section class="section"><div class="sectionTitle"><input value="${esc(s.title)}" onchange="renameSection(${si},this.value)"><div class="tools"><button onclick="moveSection(${si},-1)">↑</button><button onclick="moveSection(${si},1)">↓</button><button onclick="removeSection(${si})">×</button></div></div><div class="tableHead"><span>Date</span><span>Contenu</span><span>Image</span></div>${rows(s,si)}<button class="addRow" onclick="addRow(${si})">+ Ajouter une ligne</button></section>`).join('')}<button class="addSection" onclick="addSection()">+ Ajouter une section</button></div></section></div></div></div>`}
function mutate(fn){fn();queueSave()}
function edit(si,ri,k,v){mutate(()=>current.content.sections[si].rows[ri][k]=v)}
function editHeader(k,v){mutate(()=>current.content.header[k]=v)}
function renameSection(si,v){mutate(()=>current.content.sections[si].title=v)}
function renameCV(v){current.title=v;queueSave()}
function addRow(si,ri=-1){mutate(()=>{const r={id:id(),date:'',title:'Nouvelle entrée',text:'',linkLabel:'',linkUrl:'',imageUrl:''};current.content.sections[si].rows.splice(ri+1,0,r)});render()}
function removeRow(si,ri){mutate(()=>current.content.sections[si].rows.splice(ri,1));render()}
function addSection(){mutate(()=>current.content.sections.push({id:id(),title:'Nouvelle section',rows:[]}));render()}
function removeSection(si){if(confirm('Supprimer cette section ?')){mutate(()=>current.content.sections.splice(si,1));render()}}
function moveSection(si,d){mutate(()=>{const j=si+d;if(j>=0&&j<current.content.sections.length)[current.content.sections[si],current.content.sections[j]]=[current.content.sections[j],current.content.sections[si]]});render()}
function queueSave(){clearTimeout(saveTimer);$('#saveState')?.replaceChildren(document.createTextNode('Modification…'));saveTimer=setTimeout(async()=>{const {error}=await db.from('resumes').update({title:current.title,content:current.content}).eq('id',current.id).eq('user_id',current.user_id);if(error)toast(error.message);else $('#saveState')?.replaceChildren(document.createTextNode('Enregistré'));},450)}
async function uploadImage(si,ri,file){if(!file)return;const ext=file.name.split('.').pop()||'jpg',path=`${current.user_id}/${current.id}/${id()}.${ext}`;const {error}=await db.storage.from('cv-images').upload(path,file,{upsert:false});if(error)return toast(error.message);const {data}=db.storage.from('cv-images').getPublicUrl(path);current.content.sections[si].rows[ri].imageUrl=data.publicUrl;queueSave();render()}
async function publicCV(i){const {data,error}=await db.from('resumes').select('*').eq('id',i).eq('is_public',true).single();if(error||!data)return `<main class="loading">Ce CV n'est pas publié ou n'existe plus.</main>`;const c=data.content;return `<main class="public"><div class="publicTools" style="height:64px;padding:0 5vw;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between">${logo()}<button class="btn small" onclick="window.print()">Télécharger</button></div><div class="canvas"><div class="cv"><header class="cvHead"><strong class="cvName">${esc(c.header.name)}</strong><span class="cvHeadline">${esc(c.header.headline)}</span><small class="cvContact">${esc(c.header.contact)}</small></header>${(c.sections||[]).map(s=>`<section class="section"><div class="sectionTitle"><h3>${esc(s.title)}</h3></div>${s.rows.map(r=>`<div class="row"><span>${esc(r.date)}</span><div><strong>${esc(r.title)}</strong><p>${esc(r.text)}</p>${r.linkUrl?`<a style="font-size:10px;color:#2457e6" href="${esc(r.linkUrl)}" target="_blank">${esc(r.linkLabel||r.linkUrl)}</a>`:''}</div><div>${r.imageUrl?`<img src="${esc(r.imageUrl)}" class="imageCell img">`:''}</div></div>`).join('')}</section>`).join('')}</div></div></main>`}
async function account(user){const {data}=await db.from('profiles').select('*').eq('id',user.id).single();const name=data?.full_name||user.user_metadata?.full_name||'';return shell(`<main class="settings"><div class="eyebrow">Compte</div><h1>Gestion du compte</h1><p class="muted">Gérez vos informations et vos préférences.</p><div class="settingsCard"><label class="label">Nom complet<input id="fullName" class="field" value="${esc(name)}"></label><label class="label">Adresse e-mail<input class="field" value="${esc(user.email)}" disabled></label><button class="btn primary" onclick="saveAccount()">Enregistrer</button><div class="settingRow"><div><strong>Apparence</strong><br><span>Choisissez clair, sombre ou système.</span></div>${themeUI()}</div><div class="settingRow"><div><strong>Session</strong><br><span>Vous êtes connecté avec ${esc(user.email)}.</span></div><button class="btn danger" onclick="logout()">Se déconnecter</button></div></div></main>`,user)}
async function saveAccount(){const n=$('#fullName').value.trim();const {error}=await db.from('profiles').upsert({id:current.id,full_name:n});if(error)toast(error.message);else toast('Compte mis à jour')}
function terms(){return `<main class="legal"><div class="eyebrow">Informations légales</div><h1>Conditions générales</h1><p class="lead">Dernière mise à jour : 31 août 2026</p><div class="legalCard"><h2>1. Objet</h2><p>CV Studio est une plateforme permettant de créer, modifier, enregistrer et partager des CV. L'utilisation du service implique l'acceptation des présentes conditions.</p><h2>2. Compte</h2><p>L'utilisateur est responsable de l'exactitude des informations renseignées et de la confidentialité de son moyen d'authentification.</p><h2>3. Contenu</h2><p>L'utilisateur conserve la responsabilité des contenus qu'il ajoute. Il doit disposer des droits nécessaires sur les textes, images et liens publiés.</p><h2>4. Publication</h2><p>Un CV n'est accessible publiquement que lorsque l'utilisateur active sa publication. L'utilisateur peut demander sa suppression en supprimant le CV concerné.</p><h2>5. Données</h2><p>Les données nécessaires au fonctionnement du service sont stockées dans l'infrastructure Supabase associée au projet. Les règles d'accès limitent la modification des CV à leur propriétaire.</p><h2>6. Disponibilité</h2><p>CV Studio est fourni avec des efforts raisonnables de disponibilité et de sécurité, sans garantie d'absence totale d'interruption.</p><h2>7. Contact</h2><p>Pour toute question relative au service, utilisez les coordonnées publiées par l'éditeur du projet.</p></div></main>`}
async function logout(){await db.auth.signOut();location.hash='#/'}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3000)}
async function render(){document.documentElement.dataset.theme=theme();const hash=location.hash.slice(1)||'/';const [path,param]=hash.split('/').filter(Boolean);const {data:{user}}=await db.auth.getUser();current=user;let html;if(path==='login')html=shell(login(),null);else if(path==='dashboard')html=user?await dashboard(user):shell(`<main class="loading">Redirection…</main>`,null);else if(path==='editor'&&param){if(!user)html=shell(login(),null);else{const {data}=await db.from('resumes').select('*').eq('id',param).eq('user_id',user.id).single();if(!data)html=shell(`<main class="loading">CV introuvable.</main>`,user);else{current=data;html=await editor(user,param)}}}else if(path==='public'&&param)html=await publicCV(param);else if(path==='account')html=user?await account(user):shell(login(),null);else if(path==='terms')html=shell(terms(),user);else html=shell(landing(),user);$('#app').innerHTML=html}
window.setTheme=setTheme;window.oauth=oauth;window.emailLogin=emailLogin;window.newCV=newCV;window.deleteCV=deleteCV;window.duplicateCV=duplicateCV;window.edit=edit;window.editHeader=editHeader;window.renameSection=renameSection;window.renameCV=renameCV;window.addRow=addRow;window.removeRow=removeRow;window.addSection=addSection;window.removeSection=removeSection;window.moveSection=moveSection;window.uploadImage=uploadImage;window.saveAccount=saveAccount;window.logout=logout;window.render=render;
db.auth.onAuthStateChange(()=>setTimeout(render,0));window.addEventListener('hashchange',render);render();
</script>
</body></html>
